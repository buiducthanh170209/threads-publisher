<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Threads Publisher</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f4f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 15px 50px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 16px;
      resize: vertical;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #111;
    }

    .count {
      text-align: right;
      color: #777;
      margin-top: 6px;
      font-size: 13px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #000;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .success {
      display: block !important;
      background: #e8f8ed;
      color: #176b35;
    }

    .error {
      display: block !important;
      background: #ffeaea;
      color: #a00000;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🧵 Threads Publisher</h1>

  <textarea
    id="text"
    maxlength="500"
    placeholder="Nhập nội dung muốn đăng lên Threads..."
  ></textarea>

  <div class="count">
    <span id="count">0</span>/500
  </div>

  <button id="publish">
    🚀 ĐĂNG LÊN THREADS
  </button>

  <div id="result"></div>

</div>

<script>
  const text = document.getElementById("text");
  const count = document.getElementById("count");
  const button = document.getElementById("publish");
  const result = document.getElementById("result");

  text.addEventListener("input", () => {
    count.textContent = text.value.length;
  });

  button.addEventListener("click", async () => {
    const content = text.value.trim();

    if (!content) {
      showResult("❌ Bạn chưa nhập nội dung.", false);
      return;
    }

    button.disabled = true;
    button.textContent = "⏳ Đang đăng...";
    result.className = "";
    result.style.display = "none";

    try {
      const response = await fetch("/api/publish", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text: content
        })
      });

      const data = await response.json();

      if (data.success) {
        showResult(
          "🎉 Đăng thành công!\n\nThread ID: " +
          data.thread_id,
          true
        );

        text.value = "";
        count.textContent = "0";
      } else {
        showResult(
          "❌ Đăng thất bại.\n\n" +
          JSON.stringify(data, null, 2),
          false
        );
      }

    } catch (error) {
      showResult(
        "❌ Không kết nối được máy chủ.\n\n" +
        error.message,
        false
      );
    }

    button.disabled = false;
    button.textContent = "🚀 ĐĂNG LÊN THREADS";
  });

  function showResult(message, success) {
    result.textContent = message;
    result.className = success ? "success" : "error";
  }
</script>

</body>
</html>
