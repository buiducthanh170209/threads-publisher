<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TANH AI Threads</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #111;
    }

    .container {
      width: min(1000px, 94%);
      margin: 30px auto;
    }

    .header {
      background: #000;
      color: white;
      padding: 28px;
      border-radius: 24px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      opacity: .75;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,.05);
    }

    .card h2 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #000;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #000;
      color: white;
    }

    button:hover {
      opacity: .85;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .main-button {
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      font-size: 16px;
    }

    .product {
      display: none;
    }

    .product-info {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
    }

    .main-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 16px;
      background: #eee;
    }

    .product-price {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .product-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .description {
      color: #666;
      line-height: 1.5;
    }

    .image-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 12px 0;
    }

    .image-item {
      flex: 0 0 80px;
      height: 80px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .image-item.selected {
      border-color: #000;
    }

    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .posts {
      display: none;
    }

    .post {
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .post-number {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .post textarea {
      min-height: 130px;
      resize: vertical;
    }

    .post-image {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      margin: 12px 0;
      background: #eee;
      display: none;
    }

    .post-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .post-actions button {
      flex: 1;
    }

    .secondary {
      background: #eee;
      color: #111;
    }

    .status {
      display: none;
      padding: 14px;
      border-radius: 12px;
      margin-top: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .success {
      display: block;
      background: #e8f8ed;
      color: #176b35;
    }

    .error {
      display: block;
      background: #ffe7e7;
      color: #a00000;
    }

    .loading {
      display: block;
      background: #f0f0f0;
      color: #555;
    }

    .small {
      color: #777;
      font-size: 13px;
      margin-top: 8px;
    }

    @media (max-width: 700px) {
      .product-info {
        grid-template-columns: 1fr;
      }

      .main-image {
        max-width: 300px;
      }

      .post-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🤖 TANH AI THREADS</h1>
    <p>Sản phẩm → AI chọn ảnh → 5 bài Threads → bạn chọn và đăng</p>
  </div>

  <div class="card">

    <h2>🔗 Sản phẩm</h2>

    <input
      id="productUrl"
      type="url"
      placeholder="Dán link sản phẩm Taobao, AliExpress, Shopee..."
    >

    <div class="small">
      Website phải cho phép hệ thống truy cập dữ liệu thì mới lấy được ảnh tự động.
    </div>

    <button
      id="getProduct"
      class="main-button"
    >
      🔍 LẤY SẢN PHẨM
    </button>

    <div
      id="productStatus"
      class="status"
    ></div>

  </div>


  <div
    id="productCard"
    class="card product"
  >

    <h2>🛍️ Sản phẩm</h2>

    <div class="product-info">

      <img
        id="mainImage"
        class="main-image"
        alt="Ảnh sản phẩm"
      >

      <div>

        <div
          id="productPrice"
          class="product-price"
        ></div>

        <div
          id="productTitle"
          class="product-title"
        ></div>

        <div
          id="productDescription"
          class="description"
        ></div>

      </div>

    </div>


    <h3>🖼️ Ảnh sản phẩm</h3>

    <div
      id="imageList"
      class="image-list"
    ></div>


    <button
      id="generatePosts"
      class="main-button"
    >
      ✨ AI TẠO 5 BÀI THREADS
    </button>

  </div>


  <div
    id="postsCard"
    class="card posts"
  >

    <h2>✨ 5 bài Threads</h2>

    <div
      id="postsContainer"
    ></div>

  </div>


</div>


<script>

  const productUrl =
    document.getElementById("productUrl");

  const getProduct =
    document.getElementById("getProduct");

  const productStatus =
    document.getElementById("productStatus");

  const productCard =
    document.getElementById("productCard");

  const productPrice =
    document.getElementById("productPrice");

  const productTitle =
    document.getElementById("productTitle");

  const productDescription =
    document.getElementById("productDescription");

  const mainImage =
    document.getElementById("mainImage");

  const imageList =
    document.getElementById("imageList");

  const generatePosts =
    document.getElementById("generatePosts");

  const postsCard =
    document.getElementById("postsCard");

  const postsContainer =
    document.getElementById("postsContainer");


  let productData = null;

  let selectedImage = "";


  function showStatus(element, message, type) {

    element.textContent = message;

    element.className =
      "status " + type;

  }


  function showImages(images) {

    imageList.innerHTML = "";

    if (!images || images.length === 0) {

      imageList.innerHTML =
        "<div class='small'>Không tìm thấy ảnh tự động.</div>";

      selectedImage = "";

      mainImage.style.display = "none";

      return;

    }


    selectedImage = images[0];

    mainImage.src = selectedImage;

    mainImage.style.display = "block";


    images.forEach((image, index) => {

      const item =
        document.createElement("div");

      item.className =
        "image-item" +
        (index === 0 ? " selected" : "");


      const img =
        document.createElement("img");

      img.src = image;

      img.alt = "Ảnh " + (index + 1);


      item.appendChild(img);

      item.addEventListener("click", () => {

        selectedImage = image;

        mainImage.src = image;


        document
          .querySelectorAll(".image-item")
          .forEach(el => {

            el.classList.remove("selected");

          });


        item.classList.add("selected");


        document
          .querySelectorAll(".post-image")
          .forEach(img => {

            img.src = selectedImage;
            img.style.display = "block";

          });

      });


      imageList.appendChild(item);

    });

  }


  getProduct.addEventListener("click", async () => {

    const url =
      productUrl.value.trim();


    if (!url) {

      showStatus(
        productStatus,
        "❌ Hãy dán link sản phẩm trước.",
        "error"
      );

      return;

    }


    getProduct.disabled = true;

    getProduct.textContent =
      "⏳ Đang lấy sản phẩm...";


    showStatus(
      productStatus,
      "🌐 Đang đọc thông tin sản phẩm...",
      "loading"
    );


    try {

      const response =
        await fetch("/api/product", {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            url
          })

        });


      const data =
        await response.json();


      if (!data.success) {

        showStatus(
          productStatus,
          "❌ Không lấy được sản phẩm.\n\n" +
          JSON.stringify(data, null, 2),
          "error"
        );

        return;

      }


      productData =
        data.product;


      productPrice.textContent =
        productData.priceText && productData.priceText !== "Chưa lấy được giá"
          ? "💰 " + productData.priceText
          : "💰 Chưa lấy được giá tự động";

      productTitle.textContent =
        productData.title;


      productDescription.textContent =
        productData.description ||
        "Không có mô tả sản phẩm.";


      showImages(
        productData.images || []
      );


      productCard.style.display =
        "block";


      postsCard.style.display =
        "none";


      showStatus(
        productStatus,
        "✅ Đã lấy sản phẩm thành công.",
        "success"
      );


    } catch (error) {

      showStatus(
        productStatus,
        "❌ Không kết nối được server.\n\n" +
        error.message,
        "error"
      );

    } finally {

      getProduct.disabled = false;

      getProduct.textContent =
        "🔍 LẤY SẢN PHẨM";

    }

  });


  generatePosts.addEventListener("click", async () => {

    if (!productData) {

      return;

    }


    generatePosts.disabled = true;

    generatePosts.textContent =
      "🤖 AI đang viết 5 bài...";


    try {

      const response =
        await fetch("/api/generate-products", {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            product: productData,
            images: productData.images || [],
            count: 5
          })

        });


      const data =
        await response.json();


      if (!data.success) {

        postsCard.style.display =
          "block";


        postsContainer.innerHTML =
          `<div class="status error">
            ❌ AI tạo bài thất bại.

            ${escapeHtml(
              JSON.stringify(data, null, 2)
            )}
          </div>`;

        return;

      }


      renderPosts(
        data.posts || []
      );


      postsCard.style.display =
        "block";


      postsCard.scrollIntoView({
        behavior: "smooth"
      });


    } catch (error) {

      postsCard.style.display =
        "block";


      postsContainer.innerHTML =
        `<div class="status error">
          ❌ Không kết nối được AI.

          ${escapeHtml(error.message)}
        </div>`;

    } finally {

      generatePosts.disabled = false;

      generatePosts.textContent =
        "✨ AI TẠO 5 BÀI THREADS";

    }

  });


  function renderPosts(posts) {

    postsContainer.innerHTML = "";


    posts.forEach((post, index) => {

      const div =
        document.createElement("div");

      div.className = "post";


      div.innerHTML = `

        <div class="post-number">
          Bài ${index + 1}
        </div>

        <img
          class="post-image"
          src="${escapeAttribute(
            selectedImage
          )}"
          style="${
            selectedImage
              ? "display:block;"
              : "display:none;"
          }"
        >

        <div class="small post-help">✏️ Bạn có thể sửa bài trước khi đăng.</div>

        <textarea>${escapeHtml(
          typeof post === "string" ? post : (post.caption || "")
        )}</textarea>

        <button class="secondary save-post" type="button">💾 Lưu chỉnh sửa</button>

        <div class="post-actions">

          <button
            class="secondary choose-image"
          >
            🖼️ Đổi ảnh
          </button>

          <button
            class="publish-post"
          >
            🚀 Đăng Threads
          </button>

        </div>

        <div class="status post-status"></div>

      `;


      const chooseImage =
        div.querySelector(
          ".choose-image"
        );


      const publish =
        div.querySelector(
          ".publish-post"
        );


      const image =
        div.querySelector(
          ".post-image"
        );


      const textarea =
        div.querySelector(
          "textarea"
        );


      const status =
        div.querySelector(
          ".post-status"
        );

      const savePost =
        div.querySelector(".save-post");

      savePost.addEventListener("click", () => {
        const key = `tanh_threads_${productData?.url || "product"}_${index}`;
        localStorage.setItem(key, textarea.value);
        showStatus(status, "✅ Đã lưu chỉnh sửa bài viết.", "success");
      });

      const savedKey = `tanh_threads_${productData?.url || "product"}_${index}`;
      const savedText = localStorage.getItem(savedKey);
      if (savedText) textarea.value = savedText;


      chooseImage.addEventListener(
        "click",
        () => {

          if (!productData.images?.length) {

            showStatus(
              status,
              "Không có ảnh để chọn.",
              "error"
            );

            return;

          }


          const current =
            productData.images.indexOf(
              image.src
            );


          const next =
            (current + 1) %
            productData.images.length;


          image.src =
            productData.images[next];


          image.style.display =
            "block";

        }
      );


      publish.addEventListener(
        "click",
        async () => {

          const text =
            textarea.value.trim();


          if (!text) {

            showStatus(
              status,
              "❌ Bài viết đang trống.",
              "error"
            );

            return;

          }


          publish.disabled = true;

          publish.textContent =
            "⏳ Đang đăng...";


          showStatus(
            status,
            "📡 Đang đăng lên Threads...",
            "loading"
          );


          try {

            const response =
              await fetch(
                "/api/publish",
                {

                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    text
                  })

                }
              );


            const data =
              await response.json();


            if (!data.success) {

              showStatus(
                status,
                "❌ Đăng thất bại.\n\n" +
                JSON.stringify(
                  data,
                  null,
                  2
                ),
                "error"
              );

              return;

            }


            showStatus(
              status,
              "🎉 ĐĂNG THÀNH CÔNG!\n\n" +
              "Thread ID: " +
              (
                data.thread_id ||
                data.id ||
                "Đã đăng"
              ),
              "success"
            );


          } catch (error) {

            showStatus(
              status,
              "❌ Lỗi kết nối.\n\n" +
              error.message,
              "error"
            );

          } finally {

            publish.disabled = false;

            publish.textContent =
              "🚀 Đăng Threads";

          }

        }
      );


      postsContainer.appendChild(div);

    });

  }


  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }

</script>

</body>
</html>
